<!doctype html>
<html>
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <section id="login-view">
            <h2>Register</h2>
            <input id="register-username" type="text" placeholder="Username" />
            <input id="register-password" type="password" placeholder="Password" />
            <input id="register-admin-pass" type="password" placeholder="Admin Password" />
            <button id="register-btn">Register</button>
            <p id="register-error" class="error"></p>
            <p id="register-success" class="success"></p>
            <a id="back-to-login" class="crumb-link">Back to login</a>
        </section>
        <script src="register.js"></script>
    </body>
</html>
