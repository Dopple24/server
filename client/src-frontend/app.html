<!doctype html>
<html>
    <head>
        <title>My App</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>

    <section id="app-view">
      <div class="controls">
        <button id="run-btn">Run Task</button>
        <button id="greet-btn">Greet</button>
        <button id="refresh-btn">Refresh Map</button>
        <button id="logout-btn">Log Out</button>
        <button id="upload-btn">Upload</button>
        <button id="new-folder-btn">New Folder</button>
        <button id="tracker-btn">Track-debug</button>
      </div>
      <div id="map-view">
        <div id="nav-bar">
          <button id="up-btn">Up</button>
          <div id="breadcrumb">
            <span class="crumb-link">Home</span>
            <span class="crumb-sep">/</span>
            <span class="crumb-link">Projects</span>
            <span class="crumb-sep">/</span>
            <span class="crumb-current">Reports</span>
          </div>
        </div>
        <div id="entry-list" class="entry-list"></div>
      </div>
      <pre id="output"></pre>
    </section>

    <section id="transfer-manager" style="display: none;">
      <div class="transfer-header">Transfers</div>
      <div id="transfer-column">
      </div>
    </section>
        <script src="app.js"></script>
    </body>
</html>
