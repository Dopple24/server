<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download Shared File</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    .token-badge {
      background: #0f172a;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 1.5rem;
      border: 1px solid #334155;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-msg {
      color: var(--error);
      font-size: 0.875rem;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
    </div>

    <h1>File Shared With You</h1>
    <p id="description">Click the button below to download your shared file securely.</p>

    <div class="token-badge" id="tokenDisplay">Checking link...</div>

    <button id="downloadBtn" class="btn" disabled>
      <span>Download File</span>
    </button>

    <div class="error-msg" id="errorDisplay">Invalid or missing download token link.</div>
  </div>

  <script>
    const API_BASE_URL = 'http://127.0.0.1:8080/dl';

    // Helper: Parse URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const fileToken = urlParams.get('token') || urlParams.get('id') || urlParams.get('uuid');

    // UI Elements
    const downloadBtn = document.getElementById('downloadBtn');
    const tokenDisplay = document.getElementById('tokenDisplay');
    const errorDisplay = document.getElementById('errorDisplay');
    const description = document.getElementById('description');

    // Simple UUID Validation regex
    const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

    if (fileToken && uuidRegex.test(fileToken)) {
      tokenDisplay.textContent = `Token: ${fileToken}`;
      downloadBtn.disabled = false;
    } else if (fileToken) {
      // Fallback if token exists but isn't strict UUID syntax
      tokenDisplay.textContent = `Token: ${fileToken}`;
      downloadBtn.disabled = false;
    } else {
      tokenDisplay.style.display = 'none';
      description.textContent = 'This link appears to be incomplete or expired.';
      errorDisplay.textContent = 'No file token detected in the URL query string.';
      errorDisplay.style.display = 'block';
    }

    downloadBtn.addEventListener('click', () => {
      if (!fileToken) return;

      // Update UI state
      downloadBtn.disabled = true;
      downloadBtn.querySelector('span').textContent = 'Starting Download...';

      // Construct your file download endpoint URL
      const targetUrl = `${API_BASE_URL}/${fileToken}`;

      // Trigger standard browser download
      window.location.href = targetUrl;

      // Reset button UI after short delay
      setTimeout(() => {
        downloadBtn.disabled = false;
        downloadBtn.querySelector('span').textContent = 'Download Again';
      }, 3000);
    });
  </script>
</body>
</html>
